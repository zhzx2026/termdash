[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "termdash"
version = "0.1.0"
description = "一个好看的实时系统监控终端仪表盘"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "rich>=13.0.0",
    "textual>=8.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
termdash = "termdash.main:main"

[tool.setuptools]
packages = ["termdash"]
