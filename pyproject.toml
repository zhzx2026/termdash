[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "termdash"
version = "0.2.0"
description = "一条简洁的终端系统状态栏，实时刷新"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "psutil>=5.9.0",
]

[project.scripts]
termdash = "termdash.main:main"

[tool.setuptools]
packages = ["termdash"]
